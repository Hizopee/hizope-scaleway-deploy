# VPS partagee entre les petits projets -- CMicrolocks (+ LoveList).
# Gaia est volontairement a part (voir ../gaia-vps/) pour pouvoir la scaler
# ou la gerer independamment si l'appli prend.
services:
  cmicrolocks-api:
    build:
      context: ../../CMicrolocks-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${CMICROLOCKS_DB_CONNECTION}
      Jwt__Key: ${CMICROLOCKS_JWT_KEY}
    expose:
      - "8080"

  lovelist-api:
    build:
      context: ../../LoveList-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${LOVELIST_DB_CONNECTION}
      # Ajoute ici les cles externes (TMDB, OMDB, IGDB, Google Books,
      # Open Library) une fois disponibles -- voir ExternalApis/ dans le repo.
    ports:
      - "8081:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin-website:/srv/admin-website:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cmicrolocks-api
      - lovelist-api

volumes:
  caddy_data:
  caddy_config:
