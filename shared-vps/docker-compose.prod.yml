# VPS partagee entre les petits projets -- CMicrolocks (+ LoveList).
# Gaia est volontairement a part (voir ../gaia-vps/) pour pouvoir la scaler
# ou la gerer independamment si l'appli prend.
#
# Nom de projet fixe : le reseau Docker s'appelle donc toujours "shared-vps_default". Les
# migrations EF de LoveList (docker run jetable dans son deploy.yml) s'y branchent pour
# joindre le service "postgres" ci-dessous.
name: shared-vps

services:
  # Images construites par GitHub Actions dans chaque depot d'API et poussees sur ghcr.io :
  # les deploiements font "pull" + "up --no-build", le VPS ne compile plus rien. "build:"
  # reste en secours (docker compose build <service> a la main, depuis le checkout du depot).
  cmicrolocks-api:
    image: ghcr.io/hizopee/cmicrolocks-api:main
    build:
      context: ../../CMicrolocks-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${CMICROLOCKS_DB_CONNECTION}
      Jwt__Key: ${CMICROLOCKS_JWT_KEY}
      # index 0 (localhost) vient deja d'appsettings.json -- on complete la liste
      # par index pour le site vitrine qui appelle /api/salon-settings en cross-origin
      # (politique de confidentialite servie sur cmicrolocks.fr, pas sur api.cmicrolocks.fr).
      Cors__AllowedOrigins__1: https://cmicrolocks.fr
      Cors__AllowedOrigins__2: https://www.cmicrolocks.fr
      # URL du dashboard admin : appsettings.json la fixe a http://localhost:5173 (dev), donc
      # sans cette variable le lien "Premiere connexion" du SMS d'activation d'une praticienne
      # et les URLs de retour de l'onboarding Stripe Connect pointeraient sur localhost.
      App__AdminBaseUrl: https://admin.cmicrolocks.fr
      # HIZ-193 : SMS reels (rappels/confirmations RDV) via Twilio, expediteur
      # alphanumerique "CMICROLOCKS" (pas de numero a louer, pas de reponse SMS
      # attendue -- rappel a sens unique avec lien vers la page de confirmation).
      Twilio__AccountSid: ${CMICROLOCKS_TWILIO_ACCOUNT_SID}
      Twilio__AuthToken: ${CMICROLOCKS_TWILIO_AUTH_TOKEN}
      Twilio__FromNumber: ${CMICROLOCKS_TWILIO_FROM}
      Integrations__UseRealSms: "true"
      # HIZ-229 : cle partagee avec Hizope-pilotage-api pour api/platform/* (PAS le JWT
      # admin/employee/client -- voir PlatformKeyFilter cote CMicrolocks-backend).
      Platform__PilotageKey: ${CMICROLOCKS_PLATFORM_KEY}
      # HIZ-214 : compte Stripe plateforme Hizope (destination charge desactivee au
      # lancement -- Platform__UseConnect reste false par defaut dans appsettings.json,
      # les acomptes atterrissent sur ce compte et sont reverses a Cecilia via l'outil
      # Pilotage). WebhookSecret vient de l'endpoint Stripe configure sur
      # https://api.cmicrolocks.fr/api/payments/stripe-webhook (evenements
      # checkout.session.completed|expired|async_payment_failed).
      Stripe__SecretKey: ${CMICROLOCKS_STRIPE_SECRET_KEY}
      Stripe__PublishableKey: ${CMICROLOCKS_STRIPE_PUBLISHABLE_KEY}
      Stripe__WebhookSecret: ${CMICROLOCKS_STRIPE_WEBHOOK_SECRET}
      Integrations__UseRealPayments: "true"
      # Integrations:UseRealPush reste true par defaut (appsettings.json) : sans cette
      # variable, FirebaseAppInitializer leve une exception des qu'une notif push est
      # envoyee (aucune des deux sources de cle -- Json ou Path -- n'etait cablee ici
      # avant ce commit). Valeur = JSON complet du compte de service Firebase, minifie.
      Firebase__ServiceAccountKeyJson: ${CMICROLOCKS_FIREBASE_KEY_JSON}
      # HIZ-240 : sans ca, Storage:UploadsRootPath est absent et Program.cs retombe sur
      # wwwroot -- a l'interieur de l'image Docker, donc entierement recree (photos
      # perdues) a CHAQUE "docker compose up -d --build". /data est monte sur un volume
      # nomme persistant ci-dessous ; Program.cs y ecrit sous /data/uploads/... et sert
      # /uploads/* depuis ce meme dossier (cf. UseStaticFiles avec RequestPath "/uploads").
      Storage__UploadsRootPath: /data
      # HIZ-260 + emails equipe (nouvelle cliente, nouveau RDV) via Scaleway Transactional
      # Email. Sans ces variables, le backend simule l'envoi (simple log) -- aucun email ne
      # part. SmtpEmailService se connecte en STARTTLS (2465 = TLS implicite, incompatible).
      # Port 2587 et NON 587 : Scaleway bloque 25/465/587 en sortie des instances (time-out
      # a la connexion, constate depuis la VPS) ; TEM expose 2587 justement pour ce cas.
      # FromAddress doit etre sur le domaine verifie dans TEM.
      Integrations__UseRealEmail: "true"
      Email__SmtpHost: smtp.tem.scaleway.com
      Email__SmtpPort: "2587"
      Email__SmtpUsername: ${CMICROLOCKS_SMTP_USERNAME}
      Email__SmtpPassword: ${CMICROLOCKS_SMTP_PASSWORD}
      Email__FromAddress: no-reply@cmicrolocks.fr
      Email__FromName: CMicrolocks
    expose:
      - "8080"
    volumes:
      # HIZ-237 : sans ca, les cles ASP.NET Core Data Protection (utilisees par les
      # cookies/tokens temporaires proteges par le framework) sont perdues et
      # regenerees a CHAQUE redeploiement du container -- probleme frequent vu le
      # rythme de deploiement actuel. Volume nomme = persiste entre les recreations.
      - cmicrolocks_dataprotection_keys:/root/.aspnet/DataProtection-Keys
      # HIZ-240 : photos de profil / de reference -- meme probleme, meme remede.
      - cmicrolocks_uploads:/data

  lovelist-api:
    image: ghcr.io/hizopee/lovelist-api:main
    build:
      context: ../../LoveList-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${LOVELIST_DB_CONNECTION}
      ExternalApis__Tmdb__ApiKey: ${LOVELIST_TMDB_API_KEY}
      ExternalApis__Omdb__ApiKey: ${LOVELIST_OMDB_API_KEY}
      ExternalApis__Igdb__ClientId: ${LOVELIST_IGDB_CLIENT_ID}
      ExternalApis__Igdb__ClientSecret: ${LOVELIST_IGDB_CLIENT_SECRET}
      ExternalApis__GoogleBooks__ApiKey: ${LOVELIST_GOOGLE_BOOKS_API_KEY}
      Admin__Key: ${LOVELIST_ADMIN_KEY}
      Jwt__Key: ${LOVELIST_JWT_KEY}
      Stripe__SecretKey: ${LOVELIST_STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${LOVELIST_STRIPE_WEBHOOK_SECRET}
      Stripe__PriceMonthly: ${LOVELIST_STRIPE_PRICE_MONTHLY}
      Stripe__PriceYearly: ${LOVELIST_STRIPE_PRICE_YEARLY}
      # Comptes LoveList : e-mails (confirmation, mot de passe oublie) via Scaleway Transactional Email. Vides = les e-mails
      # sont seulement ecrits dans les journaux de l'API (rien n'est envoye).
      Email__SecretKey: ${LOVELIST_EMAIL_SECRET_KEY:-}
      Email__ProjectId: ${LOVELIST_EMAIL_PROJECT_ID:-}
      Email__FromAddress: ${LOVELIST_EMAIL_FROM_ADDRESS:-}
      Email__FromName: LoveList
      # Import Steam (cle API gratuite : https://steamcommunity.com/dev/apikey). Vide = import Steam indisponible.
      Steam__ApiKey: ${LOVELIST_STEAM_API_KEY:-}
      # Open Library n'a pas besoin de cle (API publique gratuite).
    expose:
      - "8080"

  # Environnement d'integration LoveList (branche "integration", pas "main") -- pour
  # valider en conditions reelles (Stripe en mode test) avant de merger sur main/prod.
  # Build context = un checkout SEPARE du repo (voir deploy-integration.yml), jamais le
  # meme dossier que lovelist-api -- sinon un deploiement ecraserait l'autre en pleine
  # construction d'image.
  lovelist-int-api:
    image: ghcr.io/hizopee/lovelist-api:integration
    build:
      context: ../../LoveList-backend-integration
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${LOVELIST_INT_DB_CONNECTION}
      ExternalApis__Tmdb__ApiKey: ${LOVELIST_TMDB_API_KEY}
      ExternalApis__Omdb__ApiKey: ${LOVELIST_OMDB_API_KEY}
      ExternalApis__Igdb__ClientId: ${LOVELIST_IGDB_CLIENT_ID}
      ExternalApis__Igdb__ClientSecret: ${LOVELIST_IGDB_CLIENT_SECRET}
      ExternalApis__GoogleBooks__ApiKey: ${LOVELIST_GOOGLE_BOOKS_API_KEY}
      Admin__Key: ${LOVELIST_ADMIN_KEY}
      Jwt__Key: ${LOVELIST_INT_JWT_KEY}
      # index 0 (localhost) vient deja d'appsettings.Production.json -- on remplace
      # l'index 1 (lovelist.shop prod) par le sous-domaine d'integration pour ce
      # conteneur (meme domaine racine que la prod, pas de nouveau nom de domaine).
      Cors__AllowedOrigins__1: https://int.lovelist.shop
      App__FrontendUrl: https://int.lovelist.shop
      # Cles Stripe TEST (jamais les cles live de lovelist-api ci-dessus) -- Price ID
      # specifiques au mode test, distincts de LOVELIST_STRIPE_PRICE_MONTHLY/YEARLY (live).
      Stripe__SecretKey: ${LOVELIST_INT_STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${LOVELIST_INT_STRIPE_WEBHOOK_SECRET}
      Stripe__PriceMonthly: ${LOVELIST_INT_STRIPE_PRICE_MONTHLY}
      Stripe__PriceYearly: ${LOVELIST_INT_STRIPE_PRICE_YEARLY}
      # Comptes LoveList : e-mails (confirmation, mot de passe oublie) via Scaleway Transactional Email. Vides = les e-mails
      # sont seulement ecrits dans les journaux de l'API (rien n'est envoye).
      Email__SecretKey: ${LOVELIST_EMAIL_SECRET_KEY:-}
      Email__ProjectId: ${LOVELIST_EMAIL_PROJECT_ID:-}
      Email__FromAddress: ${LOVELIST_EMAIL_FROM_ADDRESS:-}
      Email__FromName: LoveList
      # Import Steam (cle API gratuite : https://steamcommunity.com/dev/apikey). Vide = import Steam indisponible.
      Steam__ApiKey: ${LOVELIST_STEAM_API_KEY:-}
    expose:
      - "8080"

  # HIZ-229 -- tableau de bord interne Hizope (Joyce uniquement), servi sur cmicrlocks.fr
  # (domaine defensif inutilise, sans rapport avec le produit CMicrolocks). Agrege les
  # routes api/platform/* de chaque backend produit (CMicrolocks pour l'instant).
  hizope-pilotage-api:
    image: ghcr.io/hizopee/hizope-pilotage-api:main
    build:
      context: ../../Hizope-pilotage-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CMicrolocks__BaseUrl: https://api.cmicrolocks.fr
      CMicrolocks__PlatformKey: ${CMICROLOCKS_PLATFORM_KEY}
      # Lecture seule côté Stripe (liste des charges) : clé restreinte dédiée, distincte
      # de CMICROLOCKS_STRIPE_SECRET_KEY (celle-ci crée de vrais paiements côté
      # CMicrolocks-backend -- pas le même niveau de risque si elle fuit).
      Stripe__SecretKey: ${HIZOPE_PILOTAGE_STRIPE_SECRET_KEY}
      Stripe__TestSecretKey: ${HIZOPE_PILOTAGE_STRIPE_TEST_SECRET_KEY}
      # Moderation Gaia : appel interne sur le reseau Docker (jamais via Internet).
      Gaia__BaseUrl: http://gaia-api:8080
      Gaia__PlatformKey: ${GAIA_PLATFORM_KEY}
    expose:
      - "8080"

  # Gaia (anciennement seule sur gaia-vps) : meme image que le depot Gaia-backend construit
  # sur GitHub. Procedure de demenagement : MIGRATION-GAIA.md.
  gaia-api:
    image: ghcr.io/hizopee/gaia-api:main
    build:
      context: ../../Gaia-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${GAIA_DB_CONNECTION}
      Jwt__Key: ${GAIA_JWT_KEY}
      # Cle partagee avec Hizope-pilotage-api pour api/platform/moderation/* (validation des
      # nouvelles utilisatrices, signalements, verifications audio/video) -- PAS le JWT des
      # utilisatrices. Vide => ces routes repondent 503.
      Platform__PilotageKey: ${GAIA_PLATFORM_KEY}
    expose:
      - "8080"
    volumes:
      # Photos de profil et enregistrements vocaux (Assets/Photos, Assets/VoiceVerifications) :
      # sans volume, ils etaient perdus a chaque redeploiement sur gaia-vps.
      - gaia_assets:/app/Assets

  # PostgreSQL auto-heberge (remplace les bases managees Scaleway, ~75 EUR HT/mois) : une
  # base + un utilisateur par application, crees au premier demarrage par
  # postgres/init/01-create-databases.sh. Jamais expose sur Internet (pas de "ports:"),
  # joignable uniquement par les conteneurs sous le nom d'hote "postgres".
  # Procedure de migration : MIGRATION-POSTGRES.md.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CMICROLOCKS_PG_PASSWORD: ${CMICROLOCKS_PG_PASSWORD}
      LOVELIST_PG_PASSWORD: ${LOVELIST_PG_PASSWORD}
      LOVELIST_INT_PG_PASSWORD: ${LOVELIST_INT_PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - db_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sauvegarde quotidienne (02:00 UTC) de chaque base vers Scaleway Object Storage,
  # 14 jours gardes. Sauvegarde immediate : docker compose exec db-backup /backup.sh --now
  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DATABASES: "Microlocks LoveListDb LoveListDb_Integration GaiaDb"
      BACKUP_HOUR: "02"
      BACKUP_RETENTION_DAYS: "14"
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
    volumes:
      - ./postgres/backup.sh:/backup.sh:ro
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # HIZ-229 : lu par le Caddyfile via {env.HIZOPE_PILOTAGE_BASIC_AUTH_HASH}
      # (basic_auth de cmicrlocks.fr) -- hash bcrypt, jamais le mot de passe en clair.
      HIZOPE_PILOTAGE_BASIC_AUTH_HASH: ${HIZOPE_PILOTAGE_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin-website:/srv/admin-website:ro
      - ./cmicrolocks-website:/srv/cmicrolocks-website:ro
      - ./lovelist-website:/srv/lovelist-website:ro
      - ./lovelist-int-website:/srv/lovelist-int-website:ro
      - ./hizope-pilotage-website:/srv/hizope-pilotage-website:ro
      - ./hizope-website:/srv/hizope-website:ro
      # Site vitrine Gaia (meme contenu que sur gaia-vps, page exigee par la Play Console).
      - ../gaia-vps/website:/srv/gaia-website:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cmicrolocks-api
      - lovelist-api
      - lovelist-int-api
      - hizope-pilotage-api

volumes:
  caddy_data:
  caddy_config:
  cmicrolocks_dataprotection_keys:
  cmicrolocks_uploads:
  postgres_data:
  db_backups:
  gaia_assets:
